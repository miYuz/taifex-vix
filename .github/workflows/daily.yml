name: Daily update

# GitHub 的 cron 是 UTC,台北 = UTC+8。
#
# 為什麼要排三個時段,而不是只排 15:15:
# GitHub 的排程是 best-effort,尖峰時會延遲甚至整個丟掉。本專案實測:
#   2026-08-05  排 07:15 UTC → 實際 09:50 UTC 才跑(遲 2h35m)
#   2026-08-06  排 07:15 UTC → 當天完全沒觸發
# 而且 :00 / :15 / :30 這種整點分鐘是全球最擁擠的時段,更容易被排到後面。
#
# 對策:錯開到冷門分鐘,並排三個時段當備援。這個 workflow 是冪等的
# (資料沒變就不 commit),多跑幾次沒有任何副作用,只是多幾分鐘 CI 時間。
# 只要三次裡有一次跑到,當天資料就會進去。
#
# 另外 --wait 45 也是必要的:期交所結算價實測 14:32~15:12 才公布,
# 15:17 觸發時可能剛好卡在邊緣;等不到就靜靜退回前一交易日,不寫錯資料。
on:
  schedule:
    - cron: "17 7 * * 1-5"    # 台北 15:17 — 主要時段
    - cron: "23 9 * * 1-5"    # 台北 17:23 — 備援
    - cron: "43 13 * * 1-5"   # 台北 21:43 — 最後一道
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 更新資料並重建儀表板
        env:
          # 快取放 runner 的暫存區(每次都是空的,用完即丟)
          TAIFEX_VIX_DATA: ${{ runner.temp }}/taifex_cache
          # 主輸出直接寫進版控目錄
          TAIFEX_VIX_OUT: ${{ github.workspace }}/data
          PYTHONIOENCODING: utf-8
        run: |
          python -m taifex_vix.cli daily --wait 45
          python -m taifex_vix.build_dashboard docs/index.html

      - name: 有變動才 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          # 只看 data/ 決定要不要 commit。docs/ 內含建置時間戳,每次都會不一樣,
          # 拿它判斷的話三個排程時段就會各推一次同樣的資料(實測每天 3 個 commit)。
          if git diff --cached --quiet -- data; then
            echo "資料沒有變動(可能是非交易日,或結算價還沒出),不產生 commit"
            git reset -q            # 連 docs 的時間戳變動一起丟掉
            exit 0
          fi
          LAST=$(python -c "import pandas as pd; d=pd.read_csv('data/vix_txo_daily.csv'); print(d.trade_date.max())")
          git commit -m "資料更新至 ${LAST}

          由 GitHub Actions 自動執行。"
          git push

      # 這一段一定要留在這個 workflow 裡,不能指望 pages.yml 被觸發:
      # GitHub 為了防止無限迴圈,「用 GITHUB_TOKEN 推的 commit 不會觸發其他
      # workflow」。所以上面 push 完之後 pages.yml 根本不會跑,網站會永遠停在
      # 最後一次「人」推的版本 —— 資料每天更新、網頁卻不動。
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
