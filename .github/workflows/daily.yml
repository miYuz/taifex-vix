name: Daily update

# 台北時間 15:15 觸發(GitHub 的 cron 是 UTC,台北 = UTC+8 → 07:15 UTC)。
#
# 注意兩件事,所以下面的 --wait 45 是必要的、不是保險:
# 1. 期交所結算價實測在 14:32~15:12 之間才公布 —— 15:15 觸發時可能剛好卡在邊緣。
# 2. GitHub 的排程在尖峰時段常延遲 5~30 分鐘,實際觸發時間不保證。
# --wait 45 讓它從觸發起每 3 分鐘重試,最晚 16:00 前一定抓得到;
# 若真的等不到就靜靜退回前一交易日,不會寫入錯的資料。
on:
  schedule:
    - cron: "15 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 更新資料並重建儀表板
        env:
          # 快取放 runner 的暫存區(每次都是空的,用完即丟)
          TAIFEX_VIX_DATA: ${{ runner.temp }}/taifex_cache
          # 主輸出直接寫進版控目錄
          TAIFEX_VIX_OUT: ${{ github.workspace }}/data
          PYTHONIOENCODING: utf-8
        run: |
          python -m taifex_vix.cli daily --wait 45
          python -m taifex_vix.build_dashboard docs/index.html

      - name: 有變動才 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "資料沒有變動(可能是非交易日,或結算價還沒出),不產生 commit"
            exit 0
          fi
          LAST=$(python -c "import pandas as pd; d=pd.read_csv('data/vix_txo_daily.csv'); print(d.trade_date.max())")
          git commit -m "資料更新至 ${LAST}

          由 GitHub Actions 自動執行。"
          git push
